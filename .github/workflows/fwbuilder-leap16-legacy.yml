name: FWB 5.3.x baseline - openSUSE Leap 16.0

on:
  push:
    branches:
      - modernization/**
      - ci/**
  pull_request:
    branches:
      - modernization/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leap16-qt5:
    name: Build legacy FWB with Qt5
    runs-on: ubuntu-24.04
    container:
      image: opensuse/leap:16.0
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record starting point and verify build layout
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            cat /etc/os-release
            git rev-parse HEAD
            git status --short
            ls -l autogen.sh configure.in
            test -f autogen.sh
            test -f configure.in
          } 2>&1 | tee ci-logs/source.log

      - name: Install openSUSE Qt5 and build dependencies
        run: |
          set -euo pipefail
          zypper -n --gpg-auto-import-keys refresh 2>&1 | tee ci-logs/repositories.log
          zypper -n install --no-recommends \
            gcc gcc-c++ make git \
            autoconf automake libtool gettext-tools pkg-config \
            libqt5-qtbase-devel libqt5-qttools-devel libqt5-qtsvg-devel \
            libxml2-devel libxslt-devel net-snmp-devel \
            flex bison 2>&1 | tee ci-logs/dependencies.log

      - name: Configure legacy Autotools/qmake build
        run: |
          set -euo pipefail
          qmake_bin="$(command -v qmake-qt5 || command -v qmake || true)"
          test -n "$qmake_bin" || { echo 'No qmake executable found' >&2; exit 1; }
          "$qmake_bin" -v 2>&1 | tee ci-logs/qmake.log
          grep -Eq 'Qt version 5\.' ci-logs/qmake.log || {
            echo 'Qt5 required; refusing to build with a different Qt version' >&2
            exit 1
          }
          bash ./autogen.sh --prefix=/usr --with-qmake="$qmake_bin" \
            2>&1 | tee ci-logs/configure.log

      - name: Compile unchanged baseline
        run: |
          set -euo pipefail
          make -j2 2>&1 | tee ci-logs/build.log

      - name: Upload diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fwbuilder-leap16-baseline-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
