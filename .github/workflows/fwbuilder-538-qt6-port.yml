name: FWB 6.0 Qt6 - openSUSE Leap 16.0

on:
  pull_request:
    branches:
      - modernization/start
  push:
    branches:
      - modernization/start
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt6-port:
    name: Build FWB 6.0 with Qt6
    runs-on: ubuntu-24.04
    container:
      image: opensuse/leap:16.0
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Git and trust the workspace
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          zypper -n --gpg-auto-import-keys refresh 2>&1 | tee ci-logs/repositories.log
          zypper -n install --no-recommends git 2>&1 | tee ci-logs/git-install.log
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --version

      - name: Check out the Qt6 port branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify preserved autotools layout (not CMake master)
        run: |
          set -euo pipefail
          # Checkout may clean the workspace, including logs from the Git install step.
          mkdir -p ci-logs
          {
            cat /etc/os-release
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
            test -f autogen.sh
            test -f configure.in
            test -f fwbuilder3.pro
            test -f runqmake.sh
            test ! -f CMakeLists.txt
            printf 'Building preserved autotools/qmake tree with Qt6 (FWB 6.0).\n'
          } 2>&1 | tee ci-logs/source.log

      - name: Install Qt6 and build dependencies
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          zypper -n install --no-recommends \
            gcc gcc-c++ ccache make which autoconf automake libtool gettext-tools pkg-config \
            qt6-base-devel qt6-svg-devel qt6-tools-devel \
            libxml2-devel libxslt-devel net-snmp-devel \
            flex bison \
            2>&1 | tee ci-logs/dependencies.log
          qmake6 -v 2>&1 | tee ci-logs/qmake.log
          grep -Eq 'Qt version 6\.' ci-logs/qmake.log

      - name: Configure with qmake6
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          export CCACHE_DIR="$PWD/.ci-ccache"
          mkdir -p "$CCACHE_DIR"
          bash ./autogen.sh --prefix=/usr --with-qmake=qmake6 \
            2>&1 | tee ci-logs/configure.log

      - name: Compile Qt6 port
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          export CCACHE_DIR="$PWD/.ci-ccache"
          make -j"$(nproc)" 2>&1 | tee ci-logs/build.log

      - name: Upload Qt6 port diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fwbuilder-538-qt6-port-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
